<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickLoad Monitoring</title>
    <link rel="stylesheet" href="css/100_utils/styles.css">
    <link rel="stylesheet" href="css/100_utils/flatpickr.min.css">
    <link rel="stylesheet" href="css/08_mon_acv/styles_mon_acv.css">

    <script src="js/100_utils/jquery.min.js"></script>
    <script src="js/100_utils/dataTables.min.js"></script>
    <script src="js/100_utils/echarts.min.js"></script>
    <script src="js/100_utils/xlsx.full.min.js"></script>
    <script src="js/100_utils/flatpickr.min.js"></script>
    <script src="js/100_utils/ko.js"></script>
    <script src="js/100_utils/dataTable.fixedHeader.min.js"></script>
    <script src="js/100_utils/dataTable.fixedColumns.min.js"></script>
</head>

<body>
    <h1 class="top-container">ACV 이상 감지 모니터링</h1>

    <!-- 사이드바 -->
    <div id="sidebar-placeholder"></div>
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="container">
        <!-- 필터 버튼 영역 -->
        <div class="menu-container">
            <div class="group1-container">
                <h3>분석 옵션</h3>
                <div class="button_group">
                    <button class="bay-group-btn" id="btn-monitor" >모니터링</button>
                    <button class="bay-group-btn" id="btn-cycle" >Chart 분석</button>
                    <button class="bay-group-btn" id="btn-efficiency" >설비 효율</button>
                </div>
                
            </div>

            <div class="group2-container">
                <h3>필터링 옵션</h3>
                <div class="group2-inner-1">
                    <select id="shift-select">
                            <option value="all">Shift 전체</option>
                            <option value="a">A조</option>
                            <option value="b">B조</option>
                            <option value="c">C조</option>
                            <option value="d">D조</option>
                    </select>

                    <select id="eq-group-select">
                        <option value="all">설비 전체</option>
                        <!-- js 동적으로 생성 -->
                    </select>

                    <select id="recipe-select">
                            <option value="all">Recipe 전체</option>
                            <!-- js 동적으로 생성 -->
                    </select>
                </div>
                <div class="group2-inner-2">
                    <div id="date-range-select">
                        <input type="text" id="date-range" class="form-control" placeholder="날짜를 선택하세요">
                        <button id="date-init-btn" class="search-date-btn">날짜 초기화</button>
                    </div>
                </div>
            </div>

            <div class="group3-container">
                <h3>이상 모니터링</h3>
                <div class="summary-container">
                    <!-- ✅ 버튼 영역 -->
        
                </div>
            </div>

            <div class="group4-container">
                <h3>추가 옵션</h3>
                <button id="export-mon-excel-btn" class="bay-group-btn">엑셀 저장</button>
      
            </div> 
        </div>


        <!-- 메인 영역 -->
        <div class="main-wrapper">
            <div class="acv-chart-wrapper">
                <h2 style="margin-top: 0px;">설비 Cycle 분석</h2>

                <!-- ✅ 수평 정렬을 위한 새로운 container 추가 -->
                <div class="acv-body-container">
                    <div id="acv-main-container" class="acv-main-container">
                        <div class="cycle-control-wrapper">
                            <button id="prev-cycle" class="cycle-nav-btn">◀ 이전 사이클</button>
                            <span id="cycle-counter"></span>
                            <button id="next-cycle" class="cycle-nav-btn">다음 사이클 ▶</button>

                            <!-- ✅ 드롭다운 추가 -->
                            <select id="cycle-selector" class="cycle-dropdown">
                                <option value="">Track In 시간 선택</option>
                            </select>
                        </div>
                        
                        <div id="acv-chart-container" class="acv-chart-container"></div>
                    </div>

                    <div id="acv-info-table-container" class="acv-info-table-container">
                        
                        <table id="acv-cycle-info-table" style="margin-top: 10px;">
                            <thead>
                                <tr><th>상세 정보</th><th>값</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                        <table id="acv-lot-info-table">
                            <thead>
                                <tr><th>구분</th><th>내용</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 설비 효율 분석 영역 (새로 추가할 내용) -->
            <div class="acv-effi-wrapper" style="display: none;">
                <h2 style="margin-top: 0px;">설비 효율</h2>
                <div id="acv-efficiency-container">
                    <div id="effi-left-container">
                        <div id="effi-weekly-chart" class="effi-weekly-chart"></div> <!-- ⬅️ 주차별 차트 추가 -->
                        <div id="effi-daily-chart" class="effi-daily-chart"></div>
                    </div>
                    <div id="effi-middle-container">
                        <div id="effi-eqp-chart" class="effi-eqp-chart"></div>
                    </div>
                    <div id="effi-right-container">
                        <div id="effi-detail-table" class="effi-detail-content">
                            <h3 class="popup-title">상세 정보</h3>
                            <p id="effi-detail-message" class="effi-detail-message">바차트를 클릭하면 상세 정보가 표시됩니다.</p>
                            <div class="excel-btn-wrapper">
                                <button id="export-excel-btn" disabled>엑셀 저장</button>
                            </div>
                            <div class="effi-detail-scroll">
                                <table id="effi-detail-data-table" class="efficiency-table">
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>   
                    </div>
                </div>
            </div>

            <!-- 설비 모니터링 영역 -->
            <div class="acv-mon-wrapper" style="display: none;">
                <h2 style="margin-top: 0px;">상세 모니터링</h2>
                <div class="acv-mon-container-filter">
                    
                </div>
                <div id="acv-mon-container">
                    <div id="acv-mon-table"></div>
                    <div id="acv-mon-chart">
                        <div id="acv-breakdown-container" style="display:none;"></div>
                    </div>
                </div>

            </div>

        </div>  
    </div>

    <script>
        // 사이드바
        $(function() {
            // sidebar.html 로드 및 초기화
            $("#sidebar-placeholder").load("sidebar.html", function() {
                initSidebar(); // 스크립트 초기화 함수 호출
            });
        });
    </script>

    <script>
        // 권한 체크 및 사용자 정보 표시
        async function checkClientAuthority() {
            try {
                const response = await fetch('/check-client-authority');
                const data = await response.json();

                currentUserInfo = data;  // ✅ 전역 저장

                setAdminMode(data.isAdmin);

                const userNameContainer = document.createElement('div');
                userNameContainer.id = 'user-name-display';

                const userNameBox = document.createElement('div');
                userNameBox.id = 'user-name-box';
                userNameBox.innerText = `${data.authority} 모드 ( ${data.userName} )`;

                userNameContainer.appendChild(userNameBox);
                document.body.prepend(userNameContainer);
            } catch (error) {
                console.error('Error checking client authority:', error);
            }
        }

        function setAdminMode(isAdmin) {
            // 기존 버튼 (예: 공지사항 작성 버튼)
            const writeButton = document.getElementById('notice-write-button');
            if (writeButton) writeButton.style.display = isAdmin ? 'inline-block' : 'none';

            // ✅ SPEC 변경 버튼도 관리자일 때만 표시
            const specEditBtn = document.getElementById('toggle-spec-edit-btn');
            if (specEditBtn) specEditBtn.style.display = isAdmin ? 'inline-block' : 'none';
        }

        // 초기 실행
        document.addEventListener("DOMContentLoaded", () => {
            checkClientAuthority();

        });

    </script>

    <script src="js/08_mon_acv/scripts_mon_acv_init.js"></script>
    <script src="js/08_mon_acv/scripts_mon_acv_table.js"></script>
    <script src="js/08_mon_acv/scripts_mon_acv_chart_cycle.js"></script>
    <script src="js/08_mon_acv/scripts_mon_acv_chart_trend.js"></script>
    <script src="js/08_mon_acv/scripts_mon_acv_effi.js"></script>
    <script src="js/08_mon_acv/scripts_mon_acv_popup.js"></script>
    
    
</body>
</html>
