    <script>
        $(function() {
            // sidebar.html 로드 및 초기화
            $("#sidebar-placeholder").load("sidebar.html", function() {
                initSidebar(); // 스크립트 초기화 함수 호출
            });
        });

        // #myTable 은 실제 테이블 id로 바꿔주세요
        $(document).on('dblclick', 'table td, table th', function(e){
            e.preventDefault();
            e.stopPropagation();

            const cell = this;
            setTimeout(() => {
                const sel = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(cell);
                sel.removeAllRanges();
                sel.addRange(range);
            }, 0);
        });
    </script>
